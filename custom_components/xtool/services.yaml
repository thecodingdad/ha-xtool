focus:
  target:
    entity:
      integration: xtool
      domain: number
      device_class: distance
  fields:
    step:
      example: 1.0
      selector:
        number:
          min: -150
          max: 150
          step: 0.1
          unit_of_measurement: mm
          mode: box
    steps:
      example: 3
      default: 1
      selector:
        number:
          min: 1
          max: 1500
          step: 1
          mode: box
    thickness:
      example: 12.7
      selector:
        number:
          min: 0
          max: 150
          step: 0.1
          unit_of_measurement: mm
          mode: box
