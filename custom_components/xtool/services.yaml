focus:
  target:
    entity:
      integration: xtool
      domain: number
      device_class: distance
  fields:
    step:
      example: 1.0
      selector:
        number:
          min: -150
          max: 150
          step: 0.1
          unit_of_measurement: mm
          mode: box
    steps:
      example: 3
      default: 1
      selector:
        number:
          min: 1
          max: 1500
          step: 1
          mode: box
    thickness:
      example: 12.7
      selector:
        number:
          min: 0
          max: 150
          step: 0.1
          unit_of_measurement: mm
          mode: box
camera:
  target:
    entity:
      integration: xtool
      domain: camera
  fields:
    crop_width:
      example: 0
      selector:
        number:
          min: 0
          max: 460
          step: 1
          unit_of_measurement: mm
          mode: box
    crop_height:
      example: 200
      selector:
        number:
          min: 0
          max: 460
          step: 1
          unit_of_measurement: mm
          mode: box
    crop_center_x:
      example: 0
      selector:
        number:
          min: -200
          max: 200
          step: 1
          unit_of_measurement: mm
          mode: box
    crop_center_y:
      example: 0
      selector:
        number:
          min: -200
          max: 200
          step: 1
          unit_of_measurement: mm
          mode: box
